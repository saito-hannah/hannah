name: Deploy HANNAH Salon Management OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public URL
        if: always()
        id: verify
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -z "$PAGE_URL" ]; then
            PAGE_URL="https://saito-hannah.github.io/hannah/"
          fi

          HTTP_CODE="$(curl --location --silent --show-error \
            --output /tmp/hannah-page.html \
            --write-out '%{http_code}' \
            --retry 8 --retry-delay 4 --retry-all-errors \
            "$PAGE_URL" || true)"

          RESULT="FAILED"
          if [ "$HTTP_CODE" = "200" ] && grep -q "HANNAH" /tmp/hannah-page.html; then
            RESULT="SUCCESS"
          fi

          CHECKED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          cat > DEPLOYMENT_STATUS.md <<EOF
          # HANNAH Site Deployment Status

          - Result: **$RESULT**
          - Public URL: $PAGE_URL
          - HTTP status: $HTTP_CODE
          - Checked at: $CHECKED_AT
          - Commit: $GITHUB_SHA
          EOF

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Record verification result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          git diff --cached --quiet || git commit -m "Record live site verification"
          git push origin HEAD:main

      - name: Require successful live response
        if: always() && steps.verify.outputs.result != 'SUCCESS'
        run: exit 1
